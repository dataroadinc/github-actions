name: Cargo crate CI/CD

on:
  workflow_call:
    inputs:
      crate-name:
        description: "Crate name"
        required: true
        type: string
      kind:
        description: "library or binary"
        required: false
        type: string
        default: library
      test-threads:
        description: "If non-empty, pass --test-threads=N"
        required: false
        type: string
        default: ""

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo "called for ${{ inputs.crate-name }} kind=${{ inputs.kind }} threads=${{ inputs.test-threads }}"
