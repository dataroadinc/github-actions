name: Cargo auto version bump & publish

# Reusable workflow: when a build(deps) commit lands on main, bump
# the patch version with cocogitto, push a *verified* commit via
# GraphQL (so the signed-commits branch ruleset accepts it), create
# a GitHub Release, and publish to crates.io.
#
# Caller workflow:
#
#   on:
#     push:
#       branches: [main]
#       paths: [Cargo.toml, Cargo.lock]
#   permissions:
#     contents: write
#     pull-requests: write
#     id-token: write
#   jobs:
#     bump:
#       uses: legra-ai/github-actions/.github/workflows/cargo-auto-version-bump.yml@main
#       with:
#         crate-name: my-crate
#       secrets: inherit

on:
  workflow_call:
    inputs:
      crate-name:
        description: "Crate name (used in the release summary URLs)"
        required: true
        type: string
      match-mode:
        description: |
          How to recognise a dependency-update commit:
            "contains" (default) — message contains "build(deps)" or "dependencies"
            "first-line-prefix" — first line begins with "build(deps):"
          Use the stricter prefix mode in repos where casual commits may
          legitimately mention "dependencies" without intending to release.
        required: false
        type: string
        default: contains
      version-files:
        description: |
          Newline-delimited files changed by the version bump. Every listed
          file must exist and is included in the verified GraphQL commit.
        required: false
        type: string
        default: |
          Cargo.toml
          Cargo.lock
    secrets:
      CRATES_IO_TOKEN:
        description: "Token used to publish the crate to crates.io"
        required: true

jobs:
  check-dependency-update:
    name: Check if Dependency Update
    runs-on: ubuntu-latest
    outputs:
      is_dependency_update: ${{ steps.check.outputs.is_dependency_update }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Get commit message
        id: commit
        run: |
          {
            echo "message<<__EOF__"
            git log -1 --pretty=%B
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Check if dependency update
        id: check
        env:
          MESSAGE: ${{ steps.commit.outputs.message }}
          MATCH_MODE: ${{ inputs.match-mode }}
        run: |
          match=false
          case "$MATCH_MODE" in
            contains)
              if [[ "$MESSAGE" == *"build(deps)"* || "$MESSAGE" == *"dependencies"* ]]; then
                match=true
              fi
              ;;
            first-line-prefix)
              FIRST_LINE="$(printf '%s\n' "$MESSAGE" | head -n 1)"
              if [[ "$FIRST_LINE" =~ ^build\(deps\): ]]; then
                match=true
              fi
              ;;
            *)
              echo "❌ Unknown match-mode: $MATCH_MODE"
              exit 1
              ;;
          esac
          echo "is_dependency_update=$match" >> "$GITHUB_OUTPUT"
          if [ "$match" = "true" ]; then
            echo "✅ This is a dependency update (mode=$MATCH_MODE)"
          else
            echo "ℹ️  Not a dependency update, skipping (mode=$MATCH_MODE)"
          fi

  bump-version:
    name: Bump Version & Publish
    runs-on: ubuntu-latest
    needs: check-dependency-update
    if: needs.check-dependency-update.outputs.is_dependency_update == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: dtolnay/rust-toolchain@stable

      - uses: legra-ai/github-actions/.github/actions/setup-cocogitto@main

      - name: Bump patch version with cocogitto
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cog bump --patch --skip-ci
          NEW_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "Bumped to version: $NEW_VERSION"
          # Drop any local tag cog created — CI's release workflow tags after tests.
          git tag -d "v$NEW_VERSION" 2>/dev/null || true

      # Land the bump commit using GraphQL createCommitOnBranch so it is
      # signed by GitHub's web-flow key. A plain `git push` would be
      # rejected by the "Commits must have verified signatures" ruleset
      # because github-actions[bot] cannot be granted bypass.
      - name: Push verified commit via GraphQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXPECTED_OID: ${{ github.sha }}
          VERSION_FILES: ${{ inputs.version-files }}
        run: |
          HEADLINE=$(git log -1 --pretty=%s HEAD)
          BODY=$(git log -1 --pretty=%b HEAD)
          export HEADLINE BODY

          python3 <<'PY' > /tmp/payload.json
          import base64, json, os, pathlib
          def b64(p): return base64.b64encode(pathlib.Path(p).read_bytes()).decode()
          msg = {"headline": os.environ["HEADLINE"]}
          body = os.environ.get("BODY", "").strip()
          if body:
              msg["body"] = body
          version_files = [
              path.strip()
              for path in os.environ["VERSION_FILES"].splitlines()
              if path.strip()
          ]
          if not version_files:
              raise SystemExit("version-files must contain at least one path")
          missing = [path for path in version_files if not pathlib.Path(path).is_file()]
          if missing:
              raise SystemExit(f"version-files do not exist: {', '.join(missing)}")

          payload = {
              "query": "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              "variables": {
                  "input": {
                      "branch": {
                          "repositoryNameWithOwner": os.environ["REPO"],
                          "branchName": "main",
                      },
                      "message": msg,
                      "fileChanges": {
                          "additions": [
                              {"path": path, "contents": b64(path)}
                              for path in version_files
                          ]
                      },
                      "expectedHeadOid": os.environ["EXPECTED_OID"],
                  }
              }
          }
          print(json.dumps(payload))
          PY

          gh api graphql --input /tmp/payload.json > /tmp/result.json
          cat /tmp/result.json
          if grep -q '"errors"' /tmp/result.json; then
            echo "❌ GraphQL mutation returned errors"
            exit 1
          fi
          NEW_OID=$(python3 -c 'import json; print(json.load(open("/tmp/result.json"))["data"]["createCommitOnBranch"]["commit"]["oid"])')
          echo "✅ Pushed verified commit $NEW_OID for version $NEW_VERSION"

          # Sync local checkout to the new verified commit so subsequent
          # steps (cargo publish, release creation) see the bumped state.
          git fetch origin main
          git reset --hard FETCH_HEAD

      - name: Generate changelog
        uses: legra-ai/github-actions/.github/actions/generate-changelog@main
        with:
          revision: HEAD
          output-file: CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: v${{ env.NEW_VERSION }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Treats "already exists on crates.io" as success so the job is
      # safely re-runnable. See dotenvage commit 0e30aa3 for context.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          CRATE: ${{ inputs.crate-name }}
        run: |
          rc=0
          LOG=$(cargo publish --allow-dirty 2>&1) || rc=$?
          echo "$LOG"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if echo "$LOG" | grep -q "already exists on crates.io"; then
            echo "ℹ️  $CRATE $NEW_VERSION already on crates.io, skipping"
            exit 0
          fi
          exit "$rc"

      - name: Release summary
        env:
          CRATE: ${{ inputs.crate-name }}
        run: |
          echo "🎉 Successfully released v$NEW_VERSION"
          echo "📦 https://crates.io/crates/$CRATE"
          echo "📝 https://github.com/${{ github.repository }}/releases/tag/v$NEW_VERSION"
          echo "📚 https://docs.rs/$CRATE/$NEW_VERSION"
