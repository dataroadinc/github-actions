name: Generate Changelog
description: Generate changelog from conventional commits using cargo-version-info

inputs:
  revision:
    description: "Existing Git revision to generate the changelog at"
    required: true
  output-file:
    description: "File to write changelog to"
    required: false
    default: "CHANGELOG.md"

runs:
  using: composite
  steps:
    - name: Setup cargo-version-info
      uses: legra-ai/github-actions/.github/actions/setup-cargo-version-info@main

    - name: Generate changelog
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        # The revision must already exist; release workflows may create the tag
        # only after this action has generated the release body.
        cargo version-info changelog \
          --at "${{ inputs.revision }}" \
          --output "${{ inputs.output-file }}"
