name: Setup cargo-version-info
description: Install cargo-version-info with caching for version management

inputs:
  version:
    description: "Version to install (e.g., 0.2.0). Overrides env var. Defaults to 'latest'."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup cargo-binstall
      uses: dataroadinc/github-actions/.github/actions/setup-cargo-binstall@main

    - name: Determine version
      id: version
      shell: bash
      run: |
        # Priority: input > env var > default (latest)
        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${CARGO_VERSION_INFO_VERSION:-latest}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Installing cargo-version-info version: ${VERSION}"

    - name: Ensure cargo bin directory exists
      shell: bash
      run: mkdir -p "$HOME/.cargo/bin"

    - name: Add cargo bin to PATH
      shell: bash
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache cargo-version-info binary
      uses: actions/cache@v4
      id: cache-cargo-version-info
      with:
        path: ~/.cargo/bin/cargo-version-info${{ runner.os == 'Windows' && '.exe' || '' }}
        key: cargo-version-info-${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install cargo-version-info if not cached
      if: steps.cache-cargo-version-info.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Installing cargo-version-info via cargo-binstall..."
        CARGO_VERSION_INFO_BIN="$HOME/.cargo/bin/cargo-version-info"${{ runner.os == 'Windows' && '.exe' || '' }}

        # Check if binary already exists (from previous run or cache)
        if [ -f "$CARGO_VERSION_INFO_BIN" ]; then
          echo "✓ cargo-version-info binary already exists at $CARGO_VERSION_INFO_BIN"
          chmod +x "$CARGO_VERSION_INFO_BIN"
        else
          # Binary doesn't exist, install it
          echo "Binary not found, installing cargo-version-info..."
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$VERSION" = "latest" ]; then
            cargo binstall --no-confirm cargo-version-info
          else
            cargo binstall --no-confirm --version "${VERSION}" cargo-version-info
          fi

          # If still not found, force reinstall (cargo-binstall may think it's installed
          # from stale .crates.toml metadata restored by Swatinem/rust-cache, but the
          # actual binary is missing)
          if [ ! -f "$CARGO_VERSION_INFO_BIN" ]; then
            echo "Binary still not found after install, forcing reinstall..."
            if [ "$VERSION" = "latest" ]; then
              cargo binstall --no-confirm --force cargo-version-info
            else
              cargo binstall --no-confirm --force --version "${VERSION}" cargo-version-info
            fi
          fi

          # Verify binary exists and make it executable
          if [ -f "$CARGO_VERSION_INFO_BIN" ]; then
            chmod +x "$CARGO_VERSION_INFO_BIN"
            echo "✓ cargo-version-info installed and made executable"
          else
            echo "❌ Error: Binary not found at $CARGO_VERSION_INFO_BIN after installation"
            echo "Checking cargo bin directory:"
            ls -la "$HOME/.cargo/bin/" || echo "Directory does not exist"
            echo "Checking if cargo-version-info is in PATH:"
            which cargo-version-info || echo "cargo-version-info not in PATH"
            exit 1
          fi
        fi

    - name: Ensure cached binary is executable or install
      if: steps.cache-cargo-version-info.outputs.cache-hit == 'true'
      shell: bash
      run: |
        CARGO_VERSION_INFO_BIN="$HOME/.cargo/bin/cargo-version-info"${{ runner.os == 'Windows' && '.exe' || '' }}
        if [ -f "$CARGO_VERSION_INFO_BIN" ]; then
          chmod +x "$CARGO_VERSION_INFO_BIN"
          echo "✓ Ensured cached cargo-version-info binary is executable"
        else
          echo "⚠ Cached binary not found at $CARGO_VERSION_INFO_BIN, installing..."
          cargo binstall --no-confirm --force cargo-version-info

          # Verify binary exists and make it executable
          if [ -f "$CARGO_VERSION_INFO_BIN" ]; then
            chmod +x "$CARGO_VERSION_INFO_BIN"
            echo "✓ cargo-version-info installed and made executable"
          else
            echo "❌ Error: Binary not found at $CARGO_VERSION_INFO_BIN after installation"
            echo "Checking cargo bin directory:"
            ls -la "$HOME/.cargo/bin/" || echo "Directory does not exist"
            echo "Checking if cargo-version-info is in PATH:"
            which cargo-version-info || echo "cargo-version-info not in PATH"
            exit 1
          fi
        fi

    - name: Verify installation
      shell: bash
      run: |
        CARGO_VERSION_INFO_BIN="$HOME/.cargo/bin/cargo-version-info"${{ runner.os == 'Windows' && '.exe' || '' }}
        if [ -f "$CARGO_VERSION_INFO_BIN" ]; then
          # cargo-version-info is a cargo subcommand
          # Verify it works by running --help (which doesn't require a Cargo.toml)
          # Use cargo to invoke it as a subcommand
          if cargo version-info --help > /dev/null 2>&1; then
            echo "✓ cargo-version-info verified via cargo subcommand"
          else
            # Fallback: try direct binary invocation (for standalone use)
            # The binary expects "version-info" as the first argument when invoked directly
            if "$CARGO_VERSION_INFO_BIN" version-info --help > /dev/null 2>&1; then
              echo "✓ cargo-version-info verified via direct binary invocation"
            else
              echo "❌ Error: cargo-version-info binary exists but cannot be invoked"
              echo "Trying to get more info:"
              "$CARGO_VERSION_INFO_BIN" version-info --help 2>&1 || true
              exit 1
            fi
          fi
        else
          echo "❌ Error: cargo-version-info binary not found at $CARGO_VERSION_INFO_BIN"
          echo "Checking PATH: $PATH"
          echo "Checking cargo bin directory:"
          ls -la "$HOME/.cargo/bin/" || echo "Directory does not exist"
          exit 1
        fi
