name: Setup Dioxus CLI
description: Install Dioxus CLI with caching

inputs:
  version:
    description: 'Dioxus CLI version to install (e.g., 0.7.2)'
    required: true
  build-from-source:
    description: 'Build from source instead of downloading pre-built binary (fixes workspace parsing issues)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Cache Dioxus CLI
      uses: actions/cache@v4
      id: cache-dx
      with:
        path: |
          ~/.cargo/bin/dx
          ~/.cargo/bin/dx.exe
        key: dioxus-cli-${{ inputs.build-from-source == 'true' && 'source' || 'prebuilt' }}-v${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build Dioxus CLI from source
      if: steps.cache-dx.outputs.cache-hit != 'true' && inputs.build-from-source == 'true'
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        echo "Building dioxus-cli v${VERSION} from source..."
        cargo install dioxus-cli --version "=${VERSION}" --locked
        echo "✓ Built dioxus-cli v${VERSION} from source"

    - name: Download Dioxus CLI if not cached
      if: steps.cache-dx.outputs.cache-hit != 'true' && inputs.build-from-source != 'true'
      shell: bash
      run: |
        # Determine platform and archive format
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          ARCH=$(uname -m)
          if [[ "${ARCH}" == "aarch64" ]] || [[ "${ARCH}" == "arm64" ]]; then
            PLATFORM="aarch64-unknown-linux-gnu"
          elif [[ "${ARCH}" == "x86_64" ]]; then
            PLATFORM="x86_64-unknown-linux-gnu"
          fi
          ARCHIVE="tar.gz"
        elif [[ "$OSTYPE" == "darwin"* ]]; then
          if [[ "$(uname -m)" == "arm64" ]]; then
            PLATFORM="aarch64-apple-darwin"
          else
            PLATFORM="x86_64-apple-darwin"
          fi
          ARCHIVE="tar.gz"
        elif [[ "$OSTYPE" == "msys" ]] || [[ "$OSTYPE" == "win32" ]]; then
          PLATFORM="x86_64-pc-windows-msvc"
          ARCHIVE="zip"
        fi

        # Download and extract based on archive type
        VERSION="${{ inputs.version }}"
        if [[ "$ARCHIVE" == "zip" ]]; then
          curl -fsSL "https://github.com/DioxusLabs/dioxus/releases/download/v${VERSION}/dx-${PLATFORM}.zip" -o dx.zip
          unzip -q dx.zip
          mkdir -p ~/.cargo/bin
          mv dx.exe ~/.cargo/bin/dx.exe
          rm dx.zip
        else
          curl -fsSL "https://github.com/DioxusLabs/dioxus/releases/download/v${VERSION}/dx-${PLATFORM}.tar.gz" -o dx.tar.gz
          tar -xzf dx.tar.gz
          mkdir -p ~/.cargo/bin
          mv dx ~/.cargo/bin/dx
          chmod +x ~/.cargo/bin/dx
          rm dx.tar.gz
        fi

    - name: Add cargo bin to PATH
      shell: bash
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

