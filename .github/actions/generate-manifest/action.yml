name: Generate Manifest
description: Generate manifest.json for runtime distribution with version, checksums, and download URLs

inputs:
  version:
    description: "Version string (e.g., 0.2.0)"
    required: true
  git-commit:
    description: "Git commit SHA"
    required: true
  artifacts-dir:
    description: "Directory containing downloaded artifacts"
    required: true
    default: "artifacts"
  output-file:
    description: "Output manifest.json file path"
    required: true
    default: "manifest.json"
  base-url:
    description: "Base URL for downloads (e.g., /downloads/v0.2.0)"
    required: true

outputs:
  manifest-path:
    description: "Path to generated manifest.json"
    value: ${{ steps.generate.outputs.manifest-path }}

runs:
  using: composite
  steps:
    - name: Generate manifest.json
      id: generate
      shell: bash
      run: |
        set -euo pipefail

        ARTIFACTS_DIR="${{ inputs.artifacts-dir }}"
        OUTPUT_FILE="${{ inputs.output-file }}"
        VERSION="${{ inputs.version }}"
        GIT_COMMIT="${{ inputs.git-commit }}"
        BASE_URL="${{ inputs.base-url }}"

        echo "Generating manifest.json for version ${VERSION}"
        echo "Scanning artifacts in: ${ARTIFACTS_DIR}"

        # Start manifest JSON
        cat > "${OUTPUT_FILE}" << 'EOF'
        {
          "version": "VERSION_PLACEHOLDER",
          "released_at": "TIMESTAMP_PLACEHOLDER",
          "git_commit": "COMMIT_PLACEHOLDER",
          "artifacts": {
            "desktop": [],
            "cli": [],
            "backend": []
          },
          "checksums_url": "CHECKSUMS_URL_PLACEHOLDER"
        }
        EOF

        # Replace placeholders
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        sed -i.bak "s/VERSION_PLACEHOLDER/${VERSION}/g" "${OUTPUT_FILE}"
        sed -i.bak "s/TIMESTAMP_PLACEHOLDER/${TIMESTAMP}/g" "${OUTPUT_FILE}"
        sed -i.bak "s/COMMIT_PLACEHOLDER/${GIT_COMMIT}/g" "${OUTPUT_FILE}"
        sed -i.bak "s|CHECKSUMS_URL_PLACEHOLDER|${BASE_URL}/sha256sums.txt|g" "${OUTPUT_FILE}"
        rm -f "${OUTPUT_FILE}.bak"

        # Scan artifacts directory and build JSON arrays
        echo "Scanning for artifacts..."

        # Build desktop artifacts array
        DESKTOP_ARTIFACTS="[]"
        for file in "${ARTIFACTS_DIR}"/desktop-*/*; do
          if [[ -f "$file" ]]; then
            filename=$(basename "$file")
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null)
            sha256=$(sha256sum "$file" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$file" | awk '{print $1}')

            # Parse platform and arch from filename (e.g., myapp-desktop-macos-arm64-v0.2.0.dmg)
            platform=$(echo "$filename" | sed -E 's/.*-(macos|windows|linux)-.*/\1/')
            arch=$(echo "$filename" | sed -E 's/.*-(arm64|x64)-.*/\1/')

            # Build JSON object for this artifact
            artifact_json=$(jq -n \
              --arg name "$filename" \
              --arg platform "$platform" \
              --arg arch "$arch" \
              --arg size "$size" \
              --arg sha256 "$sha256" \
              --arg url "${BASE_URL}/${filename}" \
              '{name: $name, platform: $platform, arch: $arch, size_bytes: ($size | tonumber), sha256: $sha256, url: $url}')

            # Add to array
            DESKTOP_ARTIFACTS=$(echo "$DESKTOP_ARTIFACTS" | jq ". += [$artifact_json]")
            echo "  Found desktop: $filename ($size bytes)"
          fi
        done

        # Build CLI artifacts array (similar pattern)
        CLI_ARTIFACTS="[]"
        for file in "${ARTIFACTS_DIR}"/cli-*/*; do
          if [[ -f "$file" ]]; then
            filename=$(basename "$file")
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null)
            sha256=$(sha256sum "$file" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$file" | awk '{print $1}')

            platform=$(echo "$filename" | sed -E 's/.*-(macos|windows|linux)-.*/\1/')
            arch=$(echo "$filename" | sed -E 's/.*-(arm64|x64)-.*/\1/')

            artifact_json=$(jq -n \
              --arg name "$filename" \
              --arg platform "$platform" \
              --arg arch "$arch" \
              --arg size "$size" \
              --arg sha256 "$sha256" \
              --arg url "${BASE_URL}/${filename}" \
              '{name: $name, platform: $platform, arch: $arch, size_bytes: ($size | tonumber), sha256: $sha256, url: $url}')

            CLI_ARTIFACTS=$(echo "$CLI_ARTIFACTS" | jq ". += [$artifact_json]")
            echo "  Found CLI: $filename ($size bytes)"
          fi
        done

        # Update manifest with populated arrays
        jq --argjson desktop "$DESKTOP_ARTIFACTS" \
           --argjson cli "$CLI_ARTIFACTS" \
           '.artifacts.desktop = $desktop | .artifacts.cli = $cli' \
           "${OUTPUT_FILE}" > "${OUTPUT_FILE}.tmp"
        mv "${OUTPUT_FILE}.tmp" "${OUTPUT_FILE}"

        echo ""
        echo "Generated manifest.json with artifacts:"
        cat "${OUTPUT_FILE}"

        echo "manifest-path=${OUTPUT_FILE}" >> $GITHUB_OUTPUT

    - name: Validate manifest.json
      shell: bash
      run: |
        # Validate JSON syntax
        if command -v jq >/dev/null 2>&1; then
          jq empty "${{ inputs.output-file }}" || {
            echo "ERROR: Invalid JSON in manifest.json"
            exit 1
          }
          echo "✓ Manifest JSON is valid"
        else
          echo "⚠️  jq not available, skipping JSON validation"
        fi
