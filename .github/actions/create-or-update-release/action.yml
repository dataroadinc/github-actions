name: Create or Update Release
description: Create a new release or update existing one with fresh content and placeholder badges

inputs:
  version:
    description: 'Version number (e.g., 0.0.1)'
    required: true

outputs:
  release-id:
    description: 'GitHub release ID'
    value: ${{ steps.release.outputs.id }}
  release-created:
    description: 'Whether a new release was created (true/false)'
    value: ${{ steps.release.outputs.created }}

runs:
  using: composite
  steps:
    - name: Create or update release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${{ inputs.version }}"
        TAG="v${VERSION}"
        REPO="${{ github.repository }}"

        echo "Processing release for ${TAG}..."

        # Check if release already exists
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release ${TAG} exists - deleting and recreating (published releases are immutable)..."
          gh release delete "$TAG" --yes
        else
          echo "Release ${TAG} does not exist - will create new one"
        fi

        # Create minimal placeholder (full page generated when artifacts are attached)
        echo "# $TAG" > RELEASE_BODY.md
        echo "" >> RELEASE_BODY.md
        echo "Building..." >> RELEASE_BODY.md

        # Delete tag if it exists (using GitHub API to bypass repository rules)
        # This ensures tag points to current HEAD when recreated by gh release create
        echo "Ensuring tag ${TAG} will point to current HEAD..."

        # Delete remote tag via GitHub API (bypasses repository rules)
        if gh api "repos/${REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
          echo "Deleting existing remote tag ${TAG} via GitHub API..."
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}" || true
        fi

        # Delete local tag if it exists
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Deleting existing local tag ${TAG}..."
          git tag -d "$TAG" 2>/dev/null || true
        fi

        # Note: gh release create will create the tag automatically pointing to HEAD
        # We don't need to create it ourselves, which avoids repository rule violations

        # Create release as draft (always create since we delete existing)
        # gh release create will create the tag automatically pointing to current commit
        COMMIT_SHA=$(git rev-parse HEAD)
        gh release create "$TAG" \
          --title "$TAG" \
          --notes-file RELEASE_BODY.md \
          --draft=true \
          --prerelease=false \
          --target "$COMMIT_SHA"
        echo "✓ Created draft release ${TAG}"

        # Get release ID - wait a moment for GitHub API to sync, then query by tag
        sleep 2
        RELEASE_ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || echo "")

        # If query by tag failed, try to get it from release list (fallback)
        if [ -z "$RELEASE_ID" ]; then
          echo "Warning: Could not get release ID by tag, trying release list..."
          RELEASE_ID=$(gh release list --limit 1 --json id,tagName --jq '.[] | select(.tagName == "'"$TAG"'") | .id' 2>/dev/null || echo "")
        fi

        # If still no ID, fail
        if [ -z "$RELEASE_ID" ]; then
          echo "Error: Could not determine release ID for ${TAG}"
          exit 1
        fi

        echo "id=${RELEASE_ID}" >> $GITHUB_OUTPUT
        echo "created=true" >> $GITHUB_OUTPUT

        echo "Release ${TAG} ready (ID: ${RELEASE_ID})"

