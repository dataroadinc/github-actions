name: Setup cargo-fmt-toml
description: Install cargo-fmt-toml with caching for Cargo.toml formatting

inputs:
  version:
    description: "Version to install (e.g., 0.2.0). Overrides env var. Defaults to 'latest'."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup cargo-binstall
      uses: legra-ai/github-actions/.github/actions/setup-cargo-binstall@main

    - name: Determine version
      id: version
      shell: bash
      run: |
        # Priority: input > env var > default (latest)
        REQUESTED="${{ inputs.version }}"
        if [ -z "$REQUESTED" ]; then
          REQUESTED="${CARGO_FMT_TOML_VERSION:-latest}"
        fi
        # Resolve "latest" to a concrete version so the cache key tracks
        # crates.io releases. A literal "latest" in the key would mask a
        # newly-published version under the previous run's cached binary
        # for as long as the cache lives.
        if [ "$REQUESTED" = "latest" ]; then
          RESOLVED=$(curl -sfL -A "legra-ai-github-actions" \
            "https://crates.io/api/v1/crates/cargo-fmt-toml" \
            | jq -r '.crate.max_stable_version // empty')
          if [ -z "$RESOLVED" ]; then
            echo "⚠️  Could not resolve latest cargo-fmt-toml; cache will be coarse"
            RESOLVED="latest"
          fi
        else
          RESOLVED="$REQUESTED"
        fi
        echo "version=${RESOLVED}" >> $GITHUB_OUTPUT
        echo "Installing cargo-fmt-toml version: ${REQUESTED} (resolved to ${RESOLVED})"

    - name: Ensure cargo bin directory exists
      shell: bash
      run: mkdir -p "$HOME/.cargo/bin"

    - name: Add cargo bin to PATH
      shell: bash
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache cargo-fmt-toml binary
      uses: actions/cache@v6
      id: cache-cargo-fmt-toml
      with:
        path: ~/.cargo/bin/cargo-fmt-toml${{ runner.os == 'Windows' && '.exe' || '' }}
        key: cargo-fmt-toml-${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install cargo-fmt-toml if not cached
      if: steps.cache-cargo-fmt-toml.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Installing cargo-fmt-toml via cargo-binstall..."
        CARGO_FMT_TOML_BIN="$HOME/.cargo/bin/cargo-fmt-toml"${{ runner.os == 'Windows' && '.exe' || '' }}

        # Check if binary already exists (from previous run or cache)
        if [ -f "$CARGO_FMT_TOML_BIN" ]; then
          echo "✓ cargo-fmt-toml binary already exists at $CARGO_FMT_TOML_BIN"
          chmod +x "$CARGO_FMT_TOML_BIN"
        else
          # Binary doesn't exist, install it
          echo "Binary not found, installing cargo-fmt-toml..."
          VERSION="${{ steps.version.outputs.version }}"
          # Use --force to ensure installation even if cargo-binstall's cache thinks it's installed
          if [ "$VERSION" = "latest" ]; then
            cargo binstall --locked --no-confirm --force cargo-fmt-toml
          else
            cargo binstall --locked --no-confirm --force --version "${VERSION}" cargo-fmt-toml
          fi

          # Verify binary exists and make it executable
          if [ -f "$CARGO_FMT_TOML_BIN" ]; then
            chmod +x "$CARGO_FMT_TOML_BIN"
            echo "✓ cargo-fmt-toml installed and made executable"
          else
            echo "❌ Error: Binary not found at $CARGO_FMT_TOML_BIN after installation"
            echo "Checking cargo bin directory:"
            ls -la "$HOME/.cargo/bin/" || echo "Directory does not exist"
            echo "Checking if cargo-fmt-toml is in PATH:"
            which cargo-fmt-toml || echo "cargo-fmt-toml not in PATH"
            exit 1
          fi
        fi

    - name: Ensure cached binary is executable or install
      if: steps.cache-cargo-fmt-toml.outputs.cache-hit == 'true'
      shell: bash
      run: |
        CARGO_FMT_TOML_BIN="$HOME/.cargo/bin/cargo-fmt-toml"${{ runner.os == 'Windows' && '.exe' || '' }}
        if [ -f "$CARGO_FMT_TOML_BIN" ]; then
          chmod +x "$CARGO_FMT_TOML_BIN"
          echo "✓ Ensured cached cargo-fmt-toml binary is executable"
        else
          echo "⚠ Cached binary not found at $CARGO_FMT_TOML_BIN, installing..."
          VERSION="${{ steps.version.outputs.version }}"
          # Use --force to ensure installation even if cargo-binstall's cache thinks it's installed
          if [ "$VERSION" = "latest" ]; then
            cargo binstall --locked --no-confirm --force cargo-fmt-toml
          else
            cargo binstall --locked --no-confirm --force --version "${VERSION}" cargo-fmt-toml
          fi

          # Verify binary exists and make it executable
          if [ -f "$CARGO_FMT_TOML_BIN" ]; then
            chmod +x "$CARGO_FMT_TOML_BIN"
            echo "✓ cargo-fmt-toml installed and made executable"
          else
            echo "❌ Error: Binary not found at $CARGO_FMT_TOML_BIN after installation"
            echo "Checking cargo bin directory:"
            ls -la "$HOME/.cargo/bin/" || echo "Directory does not exist"
            echo "Checking if cargo-fmt-toml is in PATH:"
            which cargo-fmt-toml || echo "cargo-fmt-toml not in PATH"
            exit 1
          fi
        fi

    - name: Verify installation
      shell: bash
      run: |
        CARGO_FMT_TOML_BIN="$HOME/.cargo/bin/cargo-fmt-toml"${{ runner.os == 'Windows' && '.exe' || '' }}
        if [ -f "$CARGO_FMT_TOML_BIN" ] && [ -x "$CARGO_FMT_TOML_BIN" ]; then
          echo "✓ cargo-fmt-toml binary installed at $CARGO_FMT_TOML_BIN"
        else
          echo "Error: cargo-fmt-toml binary not found or not executable at $CARGO_FMT_TOML_BIN"
          echo "Checking cargo bin directory:"
          ls -la "$HOME/.cargo/bin/" || echo "Directory does not exist"
          exit 1
        fi
