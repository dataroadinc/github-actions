name: Setup cargo-edit
description: Install cargo-edit (provides cargo set-version) with caching

inputs:
  version:
    description: "Version to install (e.g., 0.13.8). Overrides env var."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup cargo-binstall
      uses: legra-ai/github-actions/.github/actions/setup-cargo-binstall@main

    - name: Determine version
      id: version
      shell: bash
      run: |
        # Priority: input > env var > default
        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${CARGO_EDIT_VERSION:-0.13.8}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Installing cargo-edit version: ${VERSION}"

    - name: Ensure cargo bin directory exists
      shell: bash
      run: mkdir -p "$HOME/.cargo/bin"

    - name: Cache cargo-edit binary
      uses: actions/cache@v6
      id: cache-cargo-edit
      with:
        path: ~/.cargo/bin/cargo-set-version${{ runner.os == 'Windows' && '.exe' || '' }}
        key: cargo-edit-${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install cargo-edit if not cached
      if: steps.cache-cargo-edit.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Installing cargo-edit via cargo-binstall..."
        export PATH="$HOME/.cargo/bin:$PATH"
        VERSION="${{ steps.version.outputs.version }}"
        cargo binstall --no-confirm --force --version "${VERSION}" cargo-edit
        echo "✓ cargo-edit installed"

    - name: Verify installation
      shell: bash
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        # cargo-edit provides cargo subcommands, verify via cargo
        if cargo set-version --version > /dev/null 2>&1; then
          echo "✓ cargo-edit verified via cargo set-version --version"
          cargo set-version --version
        elif cargo set-version --help > /dev/null 2>&1; then
          echo "✓ cargo-edit verified via cargo set-version --help"
        else
          echo "❌ Error: cargo set-version command not found"
          echo "Checking cargo bin directory:"
          ls -la "$HOME/.cargo/bin/" || echo "Directory does not exist"
          exit 1
        fi
