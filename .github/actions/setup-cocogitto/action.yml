name: Setup Cocogitto
description: Install Cocogitto with caching for version management and changelog generation

inputs:
  version:
    description: "Version to install (e.g., 6.5.0). Overrides env var."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup cargo-binstall
      uses: dataroadinc/github-actions/.github/actions/setup-cargo-binstall@v0.0.1

    - name: Setup cargo-edit
      uses: dataroadinc/github-actions/.github/actions/setup-cargo-edit@main

    - name: Determine version
      id: version
      shell: bash
      run: |
        # Priority: input > env var > default
        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${COCOGITTO_VERSION:-6.5.0}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Installing cocogitto version: ${VERSION}"

    - name: Ensure cargo bin directory exists
      shell: bash
      run: mkdir -p "$HOME/.cargo/bin"

    - name: Cache cocogitto binary
      uses: actions/cache@v4
      id: cache-cog
      with:
        path: ~/.cargo/bin/cog${{ runner.os == 'Windows' && '.exe' || '' }}
        key: cocogitto-${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install cocogitto if not cached
      if: steps.cache-cog.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Installing cocogitto via cargo-binstall..."
        export PATH="$HOME/.cargo/bin:$PATH"
        VERSION="${{ steps.version.outputs.version }}"
        cargo binstall --no-confirm --force --version "${VERSION}" cocogitto
        echo "✓ cocogitto installed"

    - name: Verify installation
      shell: bash
      run: |
        COG_BIN="$HOME/.cargo/bin/cog${{ runner.os == 'Windows' && '.exe' || '' }}"
        if [ -f "$COG_BIN" ]; then
          chmod +x "$COG_BIN"
          "$COG_BIN" --version
        else
          echo "❌ Error: cog binary not found at $COG_BIN"
          echo "Checking cargo bin directory:"
          ls -la "$HOME/.cargo/bin/" || echo "Directory does not exist"
          exit 1
        fi
